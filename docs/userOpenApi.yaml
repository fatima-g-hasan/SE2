openapi: 3.0.0
info:
  title: User Management API
  description: API for managing users in the system
  version: 1.0.0

servers: 
  - url: http://localhost:8080/api

paths: 
  /users:
    get:
      tags:
        - user
      summary: Get all users
      description: Retrieve a list of all users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'  

    post:
      tags:
        - user        
      summary: Create a new user
      description: Add a new user to the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201': 
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':       
          description: Invalid request data
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Error'       


  /users/{id}:
    get:
      tags:
        - user
      summary: Get a user by ID 
      description: Retrieve a specific user by their ID 
      parameters: 
        - name: id
          in: path
          required: true
          schema:
            type: string   
      responses:
        '200': 
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:    
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - user
      summary: Update a user
      description: Update an existing user's information
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - user
      summary: Delete a user
      description: Remove a user from the system
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - id
        - name
        - email
        - password

    UserInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          example: user@example.com
        password:
          type: string
      required:
        - name
        - email
        - password

    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
          nullable: true
